<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureText - End-to-End Message Encryption</title>
    <!-- Memuat Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Memuat FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="atyle.css">
    <!-- Memuat CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>

    <div class="main-wrapper">
        <header>
            <div class="logo">
                <i class="fas fa-user-shield"></i>
                <h1>Crypto<span>Graphy</span></h1>
            </div>
            <p>Enkripsi dan Deskripsi pesan. By : Ilham.</p>
        </header>

        <main class="app-container">
            <!-- Panel Kiri: Input dan Kontrol -->
            <div class="panel controls-panel">
                <div class="input-group">
                    <label for="message">
                        <i class="fas fa-edit"></i> Pesan Asli / Teks Terenkripsi
                    </label>
                    <textarea id="message" rows="8" placeholder="Ketik pesan yang ingin diamankan, atau tempel teks terenkripsi di sini..."></textarea>
                </div>

                <div class="input-group">
                    <label for="secret-key">
                        <i class="fas fa-key"></i> Kunci Rahasia (Passphrase)
                    </label>
                    <div class="key-input-wrapper">
                        <input type="password" id="secret-key" placeholder="Buat kunci kuat untuk mengunci pesan">
                        <i class="fas fa-eye toggle-password" id="toggle-key-view"></i>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="btn-encrypt" class="btn-primary">
                        <i class="fas fa-lock"></i> Enkripsi
                    </button>
                    <button id="btn-decrypt" class="btn-secondary">
                        <i class="fas fa-lock-open"></i> Dekripsi
                    </button>
                </div>
            </div>

            <!-- Panel Kanan: Hasil -->
            <div class="panel result-panel">
                <div class="input-group">
                    <label for="result">
                        <i class="fas fa-poll-h"></i> Hasil Proses
                    </label>
                    <textarea id="result" rows="12" readonly placeholder="Hasil enkripsi atau dekripsi akan muncul di sini..."></textarea>
                    <button id="btn-copy" class="btn-copy" title="Salin Hasil">
                        <i class="fas fa-copy"></i> Salin
                    </button>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2023 SecureText Local. Pastikan Anda mengingat kunci rahasia Anda.</p>
        </footer>
    </div>

    <!-- Menghubungkan logika JavaScript -->
    <script src="js/crypto-engine.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
